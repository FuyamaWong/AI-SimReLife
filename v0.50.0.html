<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI分支人生模拟器｜终极完整版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:"Microsoft YaHei",sans-serif; }
        body { background:#121330; color:#fff; padding:20px 20px 120px; }
        .container { max-width:800px; margin:0 auto; }
        .api-bar { background:#1a1b33; padding:14px 16px; border-radius:12px; margin-bottom:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
        .api-bar input { flex:1; min-width:200px; padding:10px 12px; border-radius:8px; border:none; background:#252744; color:#fff; font-size:14px; }
        .api-bar button { padding:10px 16px; background:#cc9933; border:none; border-radius:8px; color:#fff; font-weight:bold; cursor:pointer; }
        h1 { font-size:26px; margin-bottom:20px; text-align:center; color:#ffdd77; }
        h2 { font-size:18px; margin-bottom:14px; color:#ffdd77; }
        h3 { font-size:16px; margin-bottom:10px; }
        .card { background:#1b1c3a; border-radius:14px; padding:22px; margin-bottom:18px; border:1px solid #333555; }
        .form-item { margin-bottom:18px; }
        .form-item label { display:block; margin-bottom:8px; color:#ccc; font-size:14px; }
        select,input,textarea { width:100%; padding:10px 12px; background:#252744; border:1px solid #444566; border-radius:8px; color:#fff; font-size:14px; }
        textarea { min-height:80px; resize:vertical; }
        .attr-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:6px; }
        .attr-item { text-align:center; background:#252744; padding:10px 6px; border-radius:8px; }
        .attr-item label { font-size:12px; margin-bottom:4px; }
        .attr-item input { width:100%; padding:6px; font-size:13px; }
        .talent-box { background:#252744; padding:12px; border-radius:8px; line-height:1.5; min-height:50px; color:#aaa; }
        .btn { width:100%; padding:14px; border:none; border-radius:10px; font-size:15px; font-weight:bold; color:#fff; cursor:pointer; margin-top:6px; }
        .btn:disabled { background:#444 !important; cursor:not-allowed; opacity:0.6; }
        .btn-gold { background:#cc9933; }
        .btn-red { background:#a83333; }
        .btn-row { display:flex; gap:10px; margin-top:10px; }
        .btn-row button { flex:1; padding:12px; border-radius:8px; border:none; color:#fff; cursor:pointer; }
        .status-row { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:16px 0; }
        .status-card { background:#252744; padding:14px 8px; border-radius:10px; text-align:center; }
        .status-val { font-size:20px; font-weight:bold; color:#66ccff; margin-top:6px; }
        .option-btn { width:100%; text-align:left; padding:14px; margin:8px 0; background:#252744; border:1px solid #444566; border-radius:10px; color:#fff; font-size:14px; cursor:pointer; transition:0.2s; }
        .option-btn.active { background:#cc9933; border-color:#ffdd77; color:#fff; }
        .timeline { max-height:360px; overflow-y:auto; padding-right:6px; }
        .year-item { background:#252744; padding:12px; margin-bottom:8px; border-left:3px solid #cc9933; border-radius:0 8px 8px 0; font-size:14px; line-height:1.6; }
        .hide { display:none !important; }
        .tip { color:#aaa; font-size:13px; margin-top:8px; }
        .custom-input { margin-top:12px; }
        .loading { color:#ffdd77; font-size:15px; padding:10px 0; text-align:center; }
        .world-event-bar { background:#252744; padding:8px 14px; border-radius:8px; margin-bottom:12px; font-size:13px; color:#aaa; display:flex; align-items:center; gap:8px; }
        .world-event-bar span { color:#ffdd77; }
        .profession-bar { background:#252744; padding:8px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; color:#ffdd77; text-align:center; }
        .info-bar { background:#252744; padding:8px 14px; border-radius:8px; margin-bottom:12px; font-size:13px; color:#aaa; display:flex; flex-direction:column; gap:4px; }
        .info-bar span { color:#ffdd77; }
        .checkbox-item { display:flex; align-items:center; gap:8px; margin-top:5px; }
        .checkbox-item input[type="checkbox"] { width:auto; margin:0; }
    </style>
</head>
<body>
<div class="container">
    <div class="api-bar">
        <span>🔑 DeepSeek API密钥：</span>
        <input type="text" id="userApiKey" placeholder="粘贴DeepSeek API密钥" value="">

    <h1>🌍 AI分支人生模拟器</h1>

    <!-- 开局面板 -->

            <option value="现代校园青春">现代校园青春</option><option value="古风古代王朝">古风古代王朝</option><option value="古风江湖武林">古风江湖武林</option>
            <option value="古风宫廷权谋">古风宫廷权谋</option><option value="古风修仙大陆">古风修仙大陆</option><option value="末世废土求生">末世废土求生</option>
            <option value="末世异能觉醒">末世异能觉醒</option><option value="星际科幻联邦">星际科幻联邦</option><option value="星际机甲战争">星际机甲战争</option>
            <option value="玄幻修仙飞升">玄幻修仙飞升</option><option value="玄幻魔法大陆">玄幻魔法大陆</option><option value="中世纪骑士王国">中世纪骑士王国</option>
            <option value="高魔奇幻世界">高魔奇幻世界</option><option value="赛博朋克都市">赛博朋克都市</option><option value="蒸汽机械时代">蒸汽机械时代</option>
            <option value="灵气复苏现代">灵气复苏现代</option><option value="洪荒上古时代">洪荒上古时代</option><option value="鬼怪灵异世界">鬼怪灵异世界</option>
            <option value="克苏鲁诡秘世界">克苏鲁诡秘世界</option><option value="武侠江湖世界">武侠江湖世界</option><option value="仙侠道魔纷争">仙侠道魔纷争</option>
            <option value="古代经商致富">古代经商致富</option>
            <option value="三体">三体-黑暗森林</option><option value="沙丘">沙丘-香料战争</option><option value="指环王">指环王-中土世界</option>
            <option value="无职转生">无职转生-六面世界</option><option value="原神">原神-提瓦特大陆</option><option value="三国">三国-群雄割据</option>
            <option value="五代十国">五代十国-乱世风云</option><option value="二战">二战-世界大战</option><option value="美国南北战争">美国南北战争</option>
            <option value="三陆烽火">三陆烽火：剑与火药的时代</option>
            <option value="custom">自定义世界观</option>
        </select></div>
        <div class="form-item hide" id="worldCustomWrap"><textarea id="worldCustom" placeholder="描述世界规则、势力、力量体系、核心设定"></textarea></div>
        <div class="form-item"><label>🧬 种族</label><select id="raceSel"><option value="普通人类">普通人类</option><option value="高等精灵">高等精灵</option><option value="山地矮人">山地矮人</option><option value="暗夜血族">暗夜血族</option><option value="兽人战士">兽人战士</option><option value="修仙灵体">修仙灵体</option><option value="龙族后裔">龙族后裔</option><option value="九尾天狐">九尾天狐</option><option value="天使神族">天使神族</option><option value="深渊恶魔">深渊恶魔</option><option value="亡灵巫妖">亡灵巫妖</option><option value="鲛人海族">鲛人海族</option><option value="custom">自定义种族</option></select></div>
        <div class="form-item hide" id="raceCustomWrap"><input type="text" id="raceCustom" placeholder="种族特长、特征"></div>
        <div class="form-item"><label>🎓 出身背景（大幅扩充）</label><select id="bornSel"><option value="寒门平民">寒门平民</option><option value="市井小贩">市井小贩</option><option value="乡村农夫">乡村农夫</option><option value="流浪孤儿">流浪孤儿</option><option value="书香门第">书香门第</option><option value="医者世家">医者世家</option><option value="工匠世家">工匠世家</option><option value="商贾之家">商贾之家</option><option value="钱庄少爷">钱庄少爷</option><option value="武将世家">武将世家</option><option value="文官世家">文官世家</option><option value="贵族子嗣">贵族子嗣</option><option value="皇室宗亲">皇室宗亲</option><option value="宗门弟子">宗门弟子</option><option value="魔道传人">魔道传人</option><option value="江湖游侠">江湖游侠</option><option value="青楼艺伎">青楼艺伎</option><option value="山寨匪首">山寨匪首</option><option value="宫廷太监">宫廷太监</option><option value="宫女侍女">宫女侍女</option><option value="太子皇子">太子皇子</option><option value="公主郡主">公主郡主</option><option value="部落勇士">部落勇士</option><option value="海盗船长">海盗船长</option><option value="逃犯囚徒">逃犯囚徒</option><option value="天选圣子">天选圣子</option><option value="魔族少主">魔族少主</option><option value="custom">自定义出身</option></select></div>
        <div class="form-item hide" id="bornCustomWrap"><textarea id="bornCustom" placeholder="家庭、童年、成长环境"></textarea></div>
        <div class="form-item"><label>📝 人物描述</label><textarea id="charDesc" placeholder="性格、执念、梦想、秘密、弱点（自动分配属性时请详细描述）"></textarea><div class="tip" style="font-size:12px;">💡 若开启自动分配属性，AI将根据此处描述和出身背景生成初始属性</div></div>

        <div class="form-item">
            <label>✨ 先天天赋</label>
            <div class="talent-box" id="talentList">未开启天赋系统</div>

                <button style="background:#555;" id="refreshTalentsBtn">🔄 刷新天赋</button>

            </div>
        </div>
        <button class="btn btn-gold" id="startBtn">🚀 开启人生</button>

    <!-- 游戏界面 -->
    <div id="gamePanel" class="hide">
        <div class="card">
            <div class="btn-row"><button style="background:#cc9933" id="saveBtn">💾 保存</button><button style="background:#a83333" id="restartBtn">🔄 重新开局</button></div>

    </div>

    <!-- 结局 -->
    <div class="card hide" id="endPanel"><h2>⚰️ 一生落幕</h2><div id="endContent" style="line-height:1.8;margin:16px 0;white-space:pre-line;"></div><button class="btn btn-gold" id="endRestartBtn">🔄 重新开始</button></div>
</div>

function getAttrLevel(attrName, value) {
    const levels = {
        wealth: ["家徒四壁","勉强温饱","小康之家","家境殷实","富可敌国"],
        social: ["形单影只","门可罗雀","左右逢源","誉满天下","一呼百应"],
        res:    ["一无所有","捉襟见肘","小有积蓄","粮草充足","应有尽有"],
        phys:   ["弱不禁风","体魄欠佳","身强体健","铜皮铁骨","钢筋铁骨"],
        mind:   ["心浮气躁","反应迟钝","思维清晰","足智多谋","算无遗策"]
    };
    const arr = levels[attrName] || ["极低","较低","中等","较高","极高"];
    let index = 0;
    if (value <= 20) index = 0;
    else if (value <= 40) index = 1;
    else if (value <= 60) index = 2;
    else if (value <= 80) index = 3;
    else index = 4;
    return arr[index];
}

function getAttrSummary() {
    const a = game.attr;
    return `财富：${getAttrLevel('wealth', a.wealth)}，人脉：${getAttrLevel('social', a.social)}，资源：${getAttrLevel('res', a.res)}，体质：${getAttrLevel('phys', a.phys)}，心智：${getAttrLevel('mind', a.mind)}`;
}

// 初始化
window.addEventListener('DOMContentLoaded', function() {
    genTalents();
    $("userApiKey").value = API_KEY;
    
    $("startBtn").addEventListener('click', startGame);
    $("confirmBtn").addEventListener('click', confirmChoice);
    $("endRestartBtn").addEventListener('click', restartGame);
    
    $("saveBtn").addEventListener('click', saveGame);
    $("loadSaveBtn").addEventListener('click', loadGame);
    $("delSaveBtn").addEventListener('click', deleteSave);
    $("restartBtn").addEventListener('click', restartGame);
    $("refreshTalentsBtn").addEventListener('click', ()=> { genTalents(); });
    
    const enableTalentsCheck = $("enableTalentsCheck");
    if (enableTalentsCheck) {
        enableTalentsCheck.addEventListener('change', function() {
            if (this.checked) {
                genTalents();
            } else {
                game.talents = [];
                game.talentEffects = [];
                const talentListEl = $("talentList");
                if (talentListEl) talentListEl.innerHTML = '未开启天赋系统';
            }
        });
    }

    bindCustomSelect();
    
    const startAgeEl = $("startAge");
    if (startAgeEl) {
        startAgeEl.addEventListener('input', toggleCustomProfession);
        toggleCustomProfession();
    }

    const autoAttrCheck = $("autoAttrCheck");
    if (autoAttrCheck) {
        autoAttrCheck.addEventListener('change', function() {
            const disabled = this.checked;
            ["initWealth","initSocial","initRes","initPhys","initMind"].forEach(id => {
                const el = $(id);
                if (el) el.disabled = disabled;
            });
        });
    }

    const autoChoiceCheck = $("autoChoiceCheck");
    if (autoChoiceCheck) {
        autoChoiceCheck.addEventListener('change', function() {
            game.autoChoice = this.checked;
        });
    }
});

function saveApi() {
    const v = $("userApiKey").value.trim();
    if (!v) return alert("请输入密钥");
    API_KEY = v;
    localStorage.setItem("deepseekKey", v);
    alert("✅ 密钥保存成功");
}

function toggleCustomProfession() {
    const age = parseInt($("startAge")?.value || 0);
    const wrap = $("customProfessionWrap");
    if (wrap) {
        if (age >= 16) wrap.classList.remove("hide");
        else { wrap.classList.add("hide"); if ($("customProfession")) $("customProfession").value = ""; }
    }
}

function bindCustomSelect() {
    ["worldSel","raceSel","bornSel"].forEach(id => {
        const el = $(id);
        if (el) {
            el.onchange = function(){
                const wrapId = this.id.replace("Sel","CustomWrap");
                const wrapEl = $(wrapId);
                if (wrapEl) {
                    wrapEl.className = this.value==="custom"?"form-item":"form-item hide";
                    if(id === "worldSel" && this.value !== "custom" && worldPresetDesc[this.value]){
                        $("worldCustom").value = worldPresetDesc[this.value];
                    }
                }
            }
        }
    });
}

function applyTalentEffects() {
    if (game.talentDisabled) return;
    const initial = {wealth:0, social:0, res:0, phys:0, mind:0};
    game.talentEffects.forEach(eff => {
        for (let key in eff) initial[key] += eff[key];
    });
    const a = game.attr;
    a.wealth = Math.max(1, Math.min(100, a.wealth + initial.wealth));
    a.social = Math.max(1, Math.min(100, a.social + initial.social));
    a.res    = Math.max(1, Math.min(100, a.res + initial.res));
    a.phys   = Math.max(1, Math.min(100, a.phys + initial.phys));
    a.mind   = Math.max(1, Math.min(100, a.mind + initial.mind));
}

        const res = await fetch(ENDPOINT, {
            method:"POST",
            headers:{ Authorization:"Bearer "+API_KEY, "Content-Type":"application/json" },
            body:JSON.stringify({ model:MODEL, messages:[{role:"user",content:prompt}], temperature:0.75 })
        });
        if (!res.ok) throw new Error(`API请求失败：${res.status}`);
        const json = await res.json();
        return json.choices?.[0]?.message?.content || "生成失败";
    } catch(e) { console.error(e); return "生成失败"; }
}

function getAgeStage(age){
    if(age<=3)return"婴儿期"; if(age<=12)return"童年期"; if(age<=19)return"少年期";
    if(age<=29)return"青年期"; if(age<=49)return"中年期"; if(age<=69)return"中老年期";
    return"晚年期";
}

function parseAttrChange(text) {
    const map = {"财富":"wealth","人脉":"social","资源":"res","体质":"phys","心智":"mind"};
    const out = {wealth:0,social:0,res:0,phys:0,mind:0};
    const reg = /(财富|人脉|资源|体质|心智)([+-]\d+)/g;
    let m; while((m=reg.exec(text))) if (map[m[1]]) out[map[m[1]]] += parseInt(m[2]) || 0;
    return out;
}

// ==================== AI 自动生成初始属性 ====================
async function generateAutoAttrs() {
    const world = game.world || $("worldSel").value;
    const born = game.born || $("bornSel").value;
    const charDesc = game.charDesc || $("charDesc")?.value || "普通性格";
    const prompt = `你是角色创建助手。根据以下角色的出身背景和人物描述，分配初始属性值（财富、人脉、资源、体质、心智）。
每个属性1-100，总和应在150到250左右。输出格式严格为：财富:XX,人脉:XX,资源:XX,体质:XX,心智:XX 只输出这一行。
【世界观】${world}
【出身】${born}
【人物描述】${charDesc}`;
    try {
        const res = await ai(prompt);
        const parts = res.split(',');
        const attrs = {wealth:30, social:30, res:30, phys:30, mind:30};
        parts.forEach(part => {
            const [key, val] = part.split(':').map(s => s.trim());
            const num = parseInt(val);
            if (!isNaN(num) && num >= 1 && num <= 100) {
                switch(key) { case '财富': attrs.wealth=num; break; case '人脉': attrs.social=num; break; case '资源': attrs.res=num; break; case '体质': attrs.phys=num; break; case '心智': attrs.mind=num; break; }
            }
        });
        ["initWealth","initSocial","initRes","initPhys","initMind"].forEach((id,i)=>{
            const keys = ['wealth','social','res','phys','mind'];
            const el = $(id); if(el) el.value = attrs[keys[i]];
        });
        return attrs;
    } catch (e) { return {wealth:30, social:30, res:30, phys:30, mind:30}; }
}

async function startGame() {
    if(!API_KEY) return alert("请先保存API密钥！");
    game.world = $("worldSel").value === "custom" ? ($("worldCustom")?.value || "自定义") : (worldPresetDesc[$("worldSel").value] || $("worldSel").value);
    game.race = $("raceSel").value === "custom" ? ($("raceCustom")?.value || "自定义") : $("raceSel").value;
    game.born = $("bornSel").value === "custom" ? ($("bornCustom")?.value || "自定义") : $("bornSel").value;
    game.charDesc = $("charDesc")?.value || "普通性格";
    
    const autoAttr = $("autoAttrCheck")?.checked;
    if (autoAttr) {
        const a = await generateAutoAttrs();
        game.attr = { wealth:a.wealth, social:a.social, res:a.res, phys:a.phys, mind:a.mind };
    } else {
        game.attr = {
            wealth: Math.max(1, Math.min(100, Number($("initWealth")?.value || 30))),
            social: Math.max(1, Math.min(100, Number($("initSocial")?.value || 30))),
            res: Math.max(1, Math.min(100, Number($("initRes")?.value || 30))),
            phys: Math.max(1, Math.min(100, Number($("initPhys")?.value || 30))),
            mind: Math.max(1, Math.min(100, Number($("initMind")?.value || 30)))
        };
    }
    game.talentDisabled = !($("enableTalentsCheck")?.checked);
    applyTalentEffects();
    game.age = Math.max(0, Math.min(100, parseInt($("startAge")?.value || 0) || 0));
    game.history = []; game.isDead = false; game.impact = ""; game.lastImpactAge = 0;
    game.worldEvent = ""; game.profession = ""; game.autoChoice = $("autoChoiceCheck")?.checked || false;

    $("startPanel").classList.add("hide"); $("gamePanel").classList.remove("hide");

}

function stopAuto(){ if(autoTimer) clearInterval(autoTimer); autoTimer = null; }

// ==================== 死亡判定 ====================
function checkDeath(){
    if (game.isDead) return true;

    let ageRate = 0;
    if (game.age >= 80) ageRate += 0.12;
    if (game.age >= 90) ageRate += 0.3;
    if (game.age >= 100) ageRate += 0.7;

    let physRate = 0;
    if (game.attr.phys < 15) physRate += 0.2;
    if (game.attr.phys < 8) physRate += 0.4;
    if (game.attr.phys <= 0) physRate += 0.99;

    let mindRate = 0;
    if (game.attr.mind < 10) mindRate += 0.18;
    if (game.attr.mind <= 0) mindRate += 0.95;

    let condRate = 0;
    game.conditions.forEach(c => {
        if (c.includes('重病') || c.includes('濒死')) condRate += 0.5;
        if (c.includes('残疾') || c.includes('瘫痪')) condRate += 0.2;
        if (c.includes('中毒') && game.attr.phys < 30) condRate += 0.15;
    });

    let accidentalRate = 0.01;
    if (game.attr.phys < 10) accidentalRate += 0.05;
    if (game.attr.phys < 5) accidentalRate += 0.1;
    if (game.attr.mind < 10) accidentalRate += 0.03;
    if (game.conditions.includes('失明') || game.conditions.includes('昏迷')) accidentalRate += 0.08;
    if (game.attr.wealth <= 5 && game.attr.social <= 5) accidentalRate += 0.02;

    const totalRate = ageRate + physRate + mindRate + condRate + accidentalRate;

    if (Math.random() < totalRate) {
        game.isDead = true;
        game.deathReason = `因${game.attr.phys < 10 ? "体弱" : ""}${game.attr.mind < 10 ? "心智恍惚" : ""}${game.conditions.length ? "与宿疾" : ""}意外离世`;
        stopAuto();
        return true;
    }
    return false;
}

async function nextYear(){
    if(game.isDead) return;
    stopAuto(); game.age++;
    await updateWorldEvent().catch(e => console.error(e));
    const stage = getAgeStage(game.age);
    let base = {wealth:0, social:0, res:0, phys:0, mind:0};
    if(game.age <= 25){ base.phys +=1; base.mind +=1; }
    if(game.age >= 60){ base.phys -=1; }
    let impactDesc = (game.impact && game.age - game.lastImpactAge <=3) ? `【受前期影响】` : "";

    const hasEvent = Math.random() < 0.35;
    if(!hasEvent){
        let normalText = await getNormalYearDesc();
        const text = impactDesc + normalText;
        game.attr.wealth = Math.max(0, Math.min(100, game.attr.wealth + base.wealth));
        game.attr.social = Math.max(0, Math.min(100, game.attr.social + base.social));
        game.attr.res = Math.max(0, Math.min(100, game.attr.res + base.res));
        game.attr.phys = Math.max(0, Math.min(100, game.attr.phys + base.phys));
        game.attr.mind = Math.max(0, Math.min(100, game.attr.mind + base.mind));
        game.history.push({age:game.age, text, attr:`财富${base.wealth}...`});
        refreshUI(); if(checkDeath()){ await showEnd(); return; } autoNext(); return;
    }

    const optionListEl = $("optionList"); if (optionListEl) optionListEl.innerHTML = "";
    game.selected = ""; if ($("customAction")) $("customAction").value = "";
    const eventPanelEl = $("eventPanel"), loadingTipEl = $("loadingTip"), eventContentEl = $("eventContent");
    if (eventPanelEl) eventPanelEl.classList.remove("hide");
    if (loadingTipEl) loadingTipEl.classList.remove("hide");
    if (eventContentEl) eventContentEl.classList.add("hide");

    const recentHist = game.history.slice(-3).map(h=>`${h.age}岁:${h.text}`).join('；') || '无';
    const includeWorld = Math.random() < 0.5;
    const worldContext = includeWorld ? `\n世界动态：${game.worldEvent || '暂无大事'}` : '';
    const prompt = `
你是一名文学大师，请为角色今年创作一个独立且充满“世事变迁”感的年度抉择事件。
要求：体现时间推移下的变化，拥有清晰前因与过程，为角色的抉择留下空间。包含具体感官细节，字数63-108字之间。
同时，请根据事件内容，以固定格式输出以下信息（紧接事件描述后，每行一条）：
关系变更：新增或修改的人物及关系，如“爱弗尔|爱人”或“删除|旧敌”；
地点变更：事件导致的新地点，如角色移动了则写出新地点的名称，重点关注逃亡、逃、旅行等可能带来移动的行为，可以编造新地名，如某大陆某国某城；若角色回到了原地点就写原地点；若未移动则写当前地点“${game.location}”；
状态变更：新增或移除的状态，如“新增|残疾”或“移除|中毒”。
只输出这三行额外信息，不要渲染。
【角色信息】
世界观：${game.world} 种族：${game.race} 出身：${game.born}
性格：${game.charDesc} 天赋：${game.talents.join('、')}
年龄：${game.age}岁（${stage}） 职业：${game.profession || '未定'}
属性：${getAttrSummary()} ${worldContext} 近期经历：${recentHist}
当前地点：${game.location} 当前关系：${game.relationships.map(r=>`${r.name}|${r.relation}`).join('，')} 当前状态：${game.conditions.join('，')}
事件描述：`;

    const res = await ai(prompt);
    const lines = res.split('\n');
    const evLine = lines[0]?.replace(/^事件：/, '').trim() || "发生了一件事";

    for (let i=1; i<lines.length; i++) {
        const line = lines[i].trim();
        if (line.startsWith('关系变更：')) {
            const rel = line.replace('关系变更：', '').trim();
            if (rel.startsWith('删除|')) {
                const name = rel.split('|')[1];
                game.relationships = game.relationships.filter(r => r.name !== name);
            } else if (rel.includes('|')) {
                const [name, relation] = rel.split('|');
                const existing = game.relationships.find(r => r.name === name);
                if (existing) existing.relation = relation;
                else game.relationships.push({name, relation});
            }
        } else if (line.startsWith('地点变更：')) {
            const loc = line.replace('地点变更：', '').trim();
            if (loc && loc !== game.location) {
                game.location = loc;
            }
        } else if (line.startsWith('状态变更：')) {
            const cond = line.replace('状态变更：', '').trim();
            if (cond.startsWith('新增|')) {
                const state = cond.split('|')[1];
                if (!game.conditions.includes(state)) game.conditions.push(state);
            } else if (cond.startsWith('移除|')) {
                const state = cond.split('|')[1];
                game.conditions = game.conditions.filter(c => c !== state);
            }
        }
    }

    game.history.push({age:game.age, text:impactDesc+evLine});
    refreshUI();
    if (loadingTipEl) loadingTipEl.classList.add("hide");
    if ($("eventText")) $("eventText").innerText = evLine;
    if (eventContentEl) eventContentEl.classList.remove("hide");
    await genOptions();
}

async function genOptions(){
    const eventText = $("eventText")?.innerText || "";
    const includeWorld = Math.random() < 0.5;
    const worldContext = includeWorld ? `\n世界背景：${game.worldEvent || '无'}` : '';
    const prompt = `为以下事件设计4个不同行动选择，要求选项能导致不同的命运走向，且后果明确、逻辑自洽。
事件：${eventText}
世界观：${game.world}
职业：${game.profession}
属性：${getAttrSummary()}${worldContext}
格式：选项描述|属性变化（如财富+2,人脉-1）|未来影响简述。只输出4行。`;
    const optRes = await ai(prompt);
    const list = $("optionList"); if (!list) return;
    list.innerHTML = "";
    let lines = optRes.split('\n').filter(l=>l.includes('|') && l.split('|').length>=3);
    if(lines.length<4) lines = ["稳妥应对|财富+0,人脉+1,资源+0,体质+0,心智+1|平稳成长","主动出击|财富+2,人脉-1,资源+1,体质-1,心智+2|高风险高收益","寻求帮助|财富-2,人脉+3,资源+1,体质+0,心智+0|获得支持","静观其变|财富+0,人脉+0,资源+0,体质+1,心智-1|保全自身"];
    lines.slice(0,4).forEach(line => {
        const parts = line.split('|').map(i=>i.trim());
        if(parts.length<3) return;
        const [c,a,im] = parts;
        const btn = document.createElement("button");
        btn.className = "option-btn"; btn.innerText = c;
        btn.onclick = () => {
            if (autoChoiceTimer) clearTimeout(autoChoiceTimer);
            document.querySelectorAll(".option-btn").forEach(x=>x.classList.remove("active"));
            btn.classList.add("active");
            game.selected = c; game.eventAttr = a; game.eventImpact = im;
        };
        list.appendChild(btn);
    });
    if (game.autoChoice && list.children.length > 0) {
        if (autoChoiceTimer) clearTimeout(autoChoiceTimer);
        autoChoiceTimer = setTimeout(() => {
            const buttons = list.querySelectorAll('.option-btn');
            if (buttons.length) {
                const rnd = Math.floor(Math.random()*buttons.length);
                buttons[rnd].click();
                if ($("confirmBtn")) $("confirmBtn").click();
            }
        }, 3000);
    }
}

async function confirmChoice() {
    if (autoChoiceTimer) { clearTimeout(autoChoiceTimer); autoChoiceTimer = null; }
    const custom = $("customAction")?.value.trim() || "";
    if(!game.selected && !custom) { alert("请选择或输入行动！"); return; }
    let attr, impact;
    if(custom) {
        const r = await ai(`玩家自定义行动：“${custom}”。请分析影响，严格用“属性变化|影响描述”格式回复。属性变化例：财富+2,人脉-1,资源+3,体质+0,心智+1。必须包含所有五项属性。只输出一行。`);
        const parts = r.split('|').map(p=>p.trim());
        attr = parts[0] || ""; impact = parts[1] || "无影响";
        if (!/(财富|人脉|资源|体质|心智)/.test(attr)) {
            const extracted = parseAttrChange(r);
            if (Object.values(extracted).some(v => v !== 0)) {
                attr = Object.entries(extracted).map(([k,v])=> `${k}:${v>=0?'+'+v:v}`).join(',');
            } else { attr = "财富+0,人脉+0,资源+0,体质+0,心智+0"; }
        }
        game.selected = custom;
    } else { attr = game.eventAttr; impact = game.eventImpact; }
    const ac = parseAttrChange(attr);
    game.attr.wealth = Math.max(0, Math.min(100, game.attr.wealth + ac.wealth));
    game.attr.social = Math.max(0, Math.min(100, game.attr.social + ac.social));
    game.attr.res = Math.max(0, Math.min(100, game.attr.res + ac.res));
    game.attr.phys = Math.max(0, Math.min(100, game.attr.phys + ac.phys));
    game.attr.mind = Math.max(0, Math.min(100, game.attr.mind + ac.mind));
    const lastIdx = game.history.length-1;
    if(lastIdx>=0){
        game.history[lastIdx].choice = game.selected;
        game.history[lastIdx].result = await ai(`用一句话描述选择结果：${game.selected}（发生在${game.world}，角色${game.age}岁）`);
        game.history[lastIdx].attr = attr;
    }
    game.impact = impact; game.lastImpactAge = game.age;
    await updateProfession().catch(e => console.error(e));

    // 新增：根据玩家选择推断地点变更
    const eventForLocation = $("eventText")?.innerText || "";
    const chosenAction = game.selected;
    if (chosenAction && eventForLocation) {
        try {
            const locRes = await ai(`基于事件“${eventForLocation}”，角色选择了行动“${chosenAction}”。请判断该行动是否导致角色迁移到新地点。用一行回复：地点变更：新地点名称。若未移动，回复“地点变更：无变化”。`);
            if (locRes && locRes.includes('地点变更：')) {
                const newLoc = locRes.split('地点变更：')[1].trim();
                if (newLoc && newLoc !== '无变化' && newLoc !== game.location) {
                    game.location = newLoc;
                }
            }
        } catch (e) {}
    }

    $("eventPanel").classList.add("hide"); refreshUI();
    if(checkDeath()){ await showEnd(); return; }
    autoNext();
}

function saveGame() { try{localStorage.setItem(SAVE_KEY,JSON.stringify(game));alert("✅ 保存成功");}catch(e){alert("❌ 保存失败");} }
function loadGame() {
    const s=localStorage.getItem(SAVE_KEY);
    if(!s)return alert("❌ 无存档");
    game=JSON.parse(s);
    if (!game.worldEvent) game.worldEvent = "";
    if (!game.profession) game.profession = "";
    if (game.autoChoice === undefined) game.autoChoice = false;
    if (!game.talentEffects) game.talentEffects = [];
    if (game.talentDisabled === undefined) game.talentDisabled = true;
    if (!game.relationships) game.relationships = [];
    if (!game.location) game.location = "未知";
    if (!game.conditions) game.conditions = [];
    const enableCheck = $("enableTalentsCheck");
    if (enableCheck) enableCheck.checked = !game.talentDisabled;
    $("startPanel").classList.add("hide"); $("gamePanel").classList.remove("hide");
    if ($("autoChoiceCheck")) $("autoChoiceCheck").checked = game.autoChoice;
    refreshUI(); alert("✅ 读取成功");
}
function deleteSave(){if(confirm("确定删除存档？")){localStorage.removeItem(SAVE_KEY);alert("✅ 已删除");}}
function restartGame(){stopAuto(); if(autoChoiceTimer) clearTimeout(autoChoiceTimer); game.isDead=false;$("gamePanel").classList.add("hide");$("endPanel").classList.add("hide");$("startPanel").classList.remove("hide");genTalents();}
</script>
